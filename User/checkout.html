        "https://egnaelwoflqxhgrcyxpf.supabase.co",
        "sb_publishable_FR475rnpTwXtsN0QHfaYdg_IrOe8LWm",

        data: { session },

        document.documentElement.style.visibility = "visible";

              class="flex items-center justify-between border-b border-gray-100 dark:border-white/10 pb-4"
            >
              <h3 class="font-heading text-xl font-bold">Order Summary</h3>

              <label
                class="flex items-center gap-2 cursor-pointer text-xs font-semibold text-primary hover:opacity-80 transition"
              >
                <input
                  type="checkbox"
                  id="select-all-items"
                  checked
                  class="w-4 h-4 rounded text-primary focus:ring-primary accent-[#7C5CFC]"
                />
                <span>Select All</span>
              </label>
            </div>

            <div
              id="checkout-items-preview"
              class="max-h-60 overflow-y-auto pr-1 space-y-3 divide-y divide-gray-100 dark:divide-white/5"
            >
              <p class="text-xs text-gray-400">Loading order items...</p>
            </div>

            <div class="pt-2">
              <label
                class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5"
                >PROMO CODE</label
              >
              <div class="flex gap-2">
                <input
                  type="text"
                  id="promo-input"
                  placeholder="Try 'TECH10'"
                  class="flex-1 bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary uppercase"
                />
                <button
                  type="button"
                  id="apply-promo-btn"
                  class="px-4 py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 font-semibold text-xs rounded-xl hover:opacity-90 transition cursor-pointer"
                >
                  Apply
                </button>
              </div>
              <p id="promo-message" class="text-xs mt-1.5 hidden"></p>
            </div>

            <div
              class="border-t border-gray-100 dark:border-white/10 pt-4 space-y-2.5 text-sm"
            >
              <div
                class="flex justify-between text-gray-600 dark:text-gray-400"
              >
                <span>Subtotal (<span id="selected-count">0</span> items)</span>
                <span id="summary-subtotal">$0.00</span>
              </div>
              <div
                class="flex justify-between text-gray-600 dark:text-gray-400"
              >
                <span>Shipping</span>
                <span id="summary-shipping">Free</span>
              </div>
              <div
                id="discount-row"
                class="hidden justify-between text-emerald-500 font-semibold"
              >
                <span>Discount (10%)</span>
                <span id="summary-discount">-$0.00</span>
              </div>
              <div
                class="border-t border-gray-100 dark:border-white/10 pt-3 flex justify-between font-bold text-lg"
              >
                <span>Grand Total</span>
                <span id="summary-total" class="text-primary">$0.00</span>
              </div>
            </div>

            <button
              type="submit"
              id="place-order-btn"
              class="w-full py-4 rounded-2xl bg-gradient-to-r from-[#7C5CFC] to-[#34E4EA] text-white font-bold hover:opacity-95 active:scale-[0.98] transition shadow-lg shadow-[#7C5CFC]/25 cursor-pointer flex items-center justify-center gap-2"
            >
              <span>Place Order</span>
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M14 5l7 7m0 0l-7 7m7-7H3"
                />
              </svg>
            </button>
          </div>
        </div>
      </form>
    </main>

    <div
      id="toast-container"
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center"
    ></div>

    <script type="module" src="./checkout.js"></script>
  </body>
</html>
